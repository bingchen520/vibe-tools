<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Animal Memory Match｜動物翻牌配對遊戲</title>
<style>
/* ===== 樣式 ===== */
:root{
  --bg1:#fff3e0; --bg2:#e8f7ee; --ink:#5a4636; --soft:#8a7461;
  --panel:#ffffff; --card-back:#ffb4a2; --card-back2:#ff8fab; --card-front:#fffdf5;
  --accent:#ff8fab; --accent-d:#e8628a; --ok:#6bcf8f; --shadow:rgba(120,80,50,.28);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#2b2430; --bg2:#1f2b2a; --ink:#fbeedd; --soft:#d2bfae; --panel:#3a3040;
    --card-back:#d9788c; --card-back2:#b9577a; --card-front:#fff6e6; --shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg1:#2b2430; --bg2:#1f2b2a; --ink:#fbeedd; --soft:#d2bfae; --panel:#3a3040;
  --card-back:#d9788c; --card-back2:#b9577a; --card-front:#fff6e6; --shadow:rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:"Nunito","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2)); background-color:var(--bg1);
  display:flex; justify-content:center; align-items:flex-start;
  -webkit-tap-highlight-color:transparent; overflow-x:hidden;
}
.deco{position:fixed; font-size:2rem; opacity:.25; pointer-events:none; user-select:none}
.deco.d1{top:6%; left:5%} .deco.d2{top:12%; right:6%} .deco.d3{bottom:8%; left:7%} .deco.d4{bottom:6%; right:5%}
.screen{width:100%; max-width:440px; padding:20px 14px 28px; text-align:center; position:relative}
h1{margin:6px 0 4px; font-size:clamp(1.7rem,7vw,2.2rem); letter-spacing:.5px}
h1 small{display:block; font-size:.5em; color:var(--soft); font-weight:600}
.panel{background:var(--panel); border-radius:24px; box-shadow:0 8px 0 var(--shadow); padding:20px 18px}
.btn{
  font:inherit; font-weight:800; font-size:1.1rem; color:#fff; border:0; cursor:pointer;
  background:var(--accent); padding:14px 32px; border-radius:999px; min-height:48px;
  box-shadow:0 5px 0 var(--accent-d); transition:transform .1s, box-shadow .1s;
}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--accent-d)}
.btn.small{font-size:.95rem; padding:10px 22px; min-height:44px}

/* 開始畫面 */
.hero{font-size:3.2rem; line-height:1.3; margin:10px 0}
.hero span{display:inline-block; animation:bob 2s ease-in-out infinite}
.hero span:nth-child(2n){animation-delay:.3s} .hero span:nth-child(3n){animation-delay:.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.desc{font-size:1.05rem; line-height:1.7; margin:12px 0 22px; color:var(--soft); font-weight:600}

/* 資訊列 */
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:6px 0 14px}
.stat{background:var(--panel); border-radius:16px; padding:8px 4px; font-weight:800; font-size:clamp(.78rem,3.4vw,.95rem); box-shadow:0 4px 0 var(--shadow)}
.stat b{display:block; font-size:1.1em; margin-top:2px; font-variant-numeric:tabular-nums}

/* 卡牌 */
.board{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(8px,2.6vw,14px); max-width:380px; margin:0 auto 18px; position:relative}
.card{
  perspective:700px; border:0; padding:0; background:none; cursor:pointer;
  aspect-ratio:1/1.1; font:inherit; touch-action:manipulation;
}
.inner{position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .35s ease}
.card.flipped .inner{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; border-radius:20px; display:flex; align-items:center; justify-content:center;
  backface-visibility:hidden; -webkit-backface-visibility:hidden; box-shadow:0 6px 0 var(--shadow), 0 10px 16px rgba(0,0,0,.12);
  font-size:clamp(2.3rem,12vw,3.6rem);
}
.back{background:linear-gradient(145deg,var(--card-back),var(--card-back2)); border:4px solid rgba(255,255,255,.55)}
.front{background:var(--card-front); transform:rotateY(180deg); border:4px solid rgba(255,255,255,.8)}
.card:not(.flipped):not(.matched):hover .inner{transform:translateY(-3px)}
.card:not(.flipped):not(.matched):active .inner{transform:scale(.95)}
.card.matched{cursor:default; animation:pop .5s ease}
.card.matched .front{background:#e6f9ec; border-color:var(--ok)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.15) translateY(-6px)}70%{transform:scale(.97)}100%{transform:scale(1)}}
.toast{
  position:absolute; left:50%; top:45%; transform:translate(-50%,-50%) scale(.6); opacity:0; pointer-events:none;
  background:var(--ok); color:#fff; font-weight:900; font-size:1.8rem; padding:8px 26px; border-radius:999px;
  box-shadow:0 5px 0 #3fa468; z-index:5;
}
.toast.show{animation:toast .8s ease}
@keyframes toast{0%{opacity:0; transform:translate(-50%,-30%) scale(.5)}25%{opacity:1; transform:translate(-50%,-50%) scale(1.1)}75%{opacity:1; transform:translate(-50%,-60%) scale(1)}100%{opacity:0; transform:translate(-50%,-80%) scale(1)}}

/* 配對失敗搖晃 */
.card.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-3deg)}40%{transform:translateX(7px) rotate(3deg)}60%{transform:translateX(-5px) rotate(-2deg)}80%{transform:translateX(5px) rotate(2deg)}}

/* 操作列與紀錄 */
.actions{display:flex; gap:10px; justify-content:center; align-items:center}
.btn.ghost{background:var(--panel); color:var(--ink); box-shadow:0 5px 0 var(--shadow); padding:10px 18px}
.best{margin:0 0 14px; font-weight:800; color:var(--soft); font-size:.95rem}
.newrec{font-size:1.2rem; font-weight:900; color:#c2410c; background:#ffe3d1; border-radius:999px; padding:6px 16px; display:inline-block; margin-bottom:6px; animation:bob 1.2s ease-in-out infinite}

/* 彩帶 */
#confetti{position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:20}

/* 結算 */
.result h2{font-size:2rem; margin:4px 0 14px}
.result dl{margin:0 0 14px; font-weight:700}
.result dt{color:var(--soft); font-size:.95rem; margin-top:10px}
.result dd{margin:2px 0 0; font-size:1.6rem; font-weight:900}
.rating{font-size:1.5rem; font-weight:900; background:#fff3c4; color:#7a5a00; border-radius:18px; padding:10px; margin:14px 0 20px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important; transition-duration:.01s!important}}
</style>
</head>
<body>
<span class="deco d1">🍃</span><span class="deco d2">🐾</span><span class="deco d3">🌿</span><span class="deco d4">🐾</span>

<!-- 開始畫面 -->
<main class="screen" id="startScreen">
  <h1>Animal Memory Match<small>動物翻牌配對遊戲</small></h1>
  <div class="hero" aria-hidden="true"><span>🐱</span><span>🐶</span><span>🐼</span><br><span>🦊</span><span>🐸</span><span>🐰</span></div>
  <div class="panel">
    <p class="desc">翻開兩張卡牌，找到相同的動物！<br>在最短時間內完成所有配對吧！</p>
    <p class="best" id="bestStart" hidden></p>
    <button class="btn" id="startBtn" type="button">開始遊戲</button>
  </div>
</main>

<!-- 遊戲畫面 -->
<main class="screen" id="gameScreen" hidden>
  <h1>🐾 Animal Memory Match</h1>
  <div class="stats">
    <div class="stat">⏱️ 時間<b id="time">00:00</b></div>
    <div class="stat">👣 步數<b id="moves">0</b></div>
    <div class="stat">🏆 配對<b id="pairs">0 / 6</b></div>
  </div>
  <div class="board" id="board">
    <div class="toast" id="toast">Match!</div>
  </div>
  <div class="actions">
    <button class="btn small" id="restartBtn" type="button">重新開始</button>
    <button class="btn small ghost" id="muteBtn" type="button" aria-label="音效開關">🔊</button>
  </div>
</main>

<!-- 結算畫面 -->
<main class="screen result" id="resultScreen" hidden>
  <div class="panel">
    <h2>🎉 恭喜完成！</h2>
    <dl>
      <dt>完成時間</dt><dd><span id="rTime">0</span> 秒</dd>
      <dt>總步數</dt><dd><span id="rMoves">0</span> 步</dd>
      <dt>配對成功</dt><dd id="rPairs">6 / 6</dd>
    </dl>
    <div class="newrec" id="newRec" hidden>🏅 新紀錄！</div>
    <div class="rating" id="rRating"></div>
    <p class="best" id="rBest"></p>
    <button class="btn" id="againBtn" type="button">再玩一次</button>
  </div>
</main>

<canvas id="confetti" aria-hidden="true"></canvas>

<script>
/* ===== 遊戲邏輯 ===== */
(function(){
  "use strict";
  var ANIMALS = ["🐱","🐶","🐼","🦊","🐸","🐰"];
  var TOTAL_PAIRS = ANIMALS.length;

  var $ = function(id){ return document.getElementById(id); };
  var startScreen=$("startScreen"), gameScreen=$("gameScreen"), resultScreen=$("resultScreen");
  var boardEl=$("board"), toastEl=$("toast");
  var timeEl=$("time"), movesEl=$("moves"), pairsEl=$("pairs");

  var firstCard=null, secondCard=null;
  var locked=false, moves=0, matched=0;
  var timerId=null, startTime=0, elapsed=0, mismatchTimeout=null, shakeTimeout=null;

  /* ----- 本機儲存（失敗時安靜略過） ----- */
  var BEST_KEY="amm_best", MUTE_KEY="amm_muted";
  function loadBest(){
    try{
      var o=JSON.parse(localStorage.getItem(BEST_KEY));
      if(o && isFinite(o.time) && isFinite(o.moves)) return o;
    }catch(e){}
    return {time:null, moves:null};
  }
  function saveBest(o){ try{ localStorage.setItem(BEST_KEY, JSON.stringify(o)); }catch(e){} }
  var muted=false;
  try{ muted = localStorage.getItem(MUTE_KEY)==="1"; }catch(e){}
  function bestText(b){
    if(b.time===null || b.moves===null) return "";
    return "🏅 最佳：最短 "+b.time+" 秒｜最少 "+b.moves+" 步";
  }
  function renderStartBest(){
    var t=bestText(loadBest()), el=$("bestStart");
    el.textContent=t; el.hidden=!t;
  }

  /* ----- 彩帶（Canvas） ----- */
  var cvs=$("confetti"), cctx=cvs.getContext("2d");
  var confettiRaf=null, confetti=[], spawnUntil=0, cw=0, ch=0;
  var COLORS=["#ff8fab","#ffb703","#6bcf8f","#74c0fc","#b197fc","#ffd6a5","#ff6b6b"];
  function sizeConfetti(){
    var dpr=window.devicePixelRatio||1;
    cw=window.innerWidth; ch=window.innerHeight;
    cvs.width=Math.round(cw*dpr); cvs.height=Math.round(ch*dpr);
    cctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function addPiece(){
    confetti.push({
      x:Math.random()*cw, y:-12-Math.random()*cw*0.2,
      vx:(Math.random()-0.5)*3, vy:2+Math.random()*3.5,
      w:6+Math.random()*7, h:9+Math.random()*9,
      rot:Math.random()*6.28, vr:(Math.random()-0.5)*0.3,
      sway:Math.random()*6.28, color:COLORS[Math.floor(Math.random()*COLORS.length)],
      round:Math.random()<0.25
    });
  }
  function stopConfetti(){
    if(confettiRaf!==null){ cancelAnimationFrame(confettiRaf); confettiRaf=null; }
    confetti=[]; cctx.clearRect(0,0,cw,ch);
  }
  function startConfetti(){
    stopConfetti();
    if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    sizeConfetti();
    for(var i=0;i<90;i++) addPiece();
    spawnUntil=Date.now()+1800;
    (function frame(){
      cctx.clearRect(0,0,cw,ch);
      if(Date.now()<spawnUntil){ for(var k=0;k<3;k++) addPiece(); }
      confetti=confetti.filter(function(c){ return c.y<ch+24; });
      confetti.forEach(function(c){
        c.sway+=0.06; c.x+=c.vx+Math.sin(c.sway)*0.8; c.y+=c.vy; c.rot+=c.vr;
        cctx.save(); cctx.translate(c.x,c.y); cctx.rotate(c.rot);
        cctx.fillStyle=c.color;
        if(c.round){ cctx.beginPath(); cctx.arc(0,0,c.w/2,0,6.28); cctx.fill(); }
        else cctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);
        cctx.restore();
      });
      if(confetti.length>0 || Date.now()<spawnUntil){ confettiRaf=requestAnimationFrame(frame); }
      else{ confettiRaf=null; cctx.clearRect(0,0,cw,ch); }
    })();
  }
  window.addEventListener("resize", function(){ if(confettiRaf!==null) sizeConfetti(); });

  /* ----- 音效（Web Audio 合成）與震動 ----- */
  var audioCtx=null;
  function ensureAudio(){
    if(audioCtx) return audioCtx;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(AC){ try{ audioCtx=new AC(); }catch(e){ audioCtx=null; } }
    return audioCtx;
  }
  function tone(freq,start,dur,type,vol){
    var ctx=ensureAudio(); if(!ctx) return;
    var t0=ctx.currentTime+start, osc=ctx.createOscillator(), g=ctx.createGain();
    osc.type=type||"sine"; osc.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.15,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+dur+0.05);
  }
  function playSound(name){
    if(muted) return;
    var ctx=ensureAudio(); if(!ctx) return;
    if(ctx.state==="suspended") ctx.resume();
    if(name==="flip"){ tone(620,0,0.08,"triangle",0.12); }
    else if(name==="match"){ tone(660,0,0.12,"sine",0.16); tone(880,0.1,0.18,"sine",0.16); }
    else if(name==="miss"){ tone(260,0,0.14,"sawtooth",0.07); tone(190,0.12,0.2,"sawtooth",0.07); }
    else if(name==="win"){ [523,659,784,1047].forEach(function(f,i){ tone(f,i*0.14,0.25,"triangle",0.16); }); }
  }
  function vibrate(p){ if(!muted && navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }
  function renderMute(){
    var b=$("muteBtn"); b.textContent=muted?"🔇":"🔊";
    b.setAttribute("aria-pressed", muted?"true":"false");
  }

  function shuffle(arr){            // Fisher–Yates
    var a=arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function pad(n){ return (n<10?"0":"")+n; }
  function formatTime(s){ return pad(Math.floor(s/60))+":"+pad(s%60); }

  function showScreen(el){
    [startScreen,gameScreen,resultScreen].forEach(function(s){ s.hidden = (s!==el); });
  }

  /* 計時器：永遠只會有一個 */
  function stopTimer(){ if(timerId!==null){ clearInterval(timerId); timerId=null; } }
  function startTimer(){
    stopTimer();
    startTime=Date.now(); elapsed=0; timeEl.textContent=formatTime(0);
    timerId=setInterval(function(){
      elapsed=Math.floor((Date.now()-startTime)/1000);
      timeEl.textContent=formatTime(elapsed);
    },250);
  }

  function updateInfo(){
    movesEl.textContent=moves;
    pairsEl.textContent=matched+" / "+TOTAL_PAIRS;
  }

  /* 建立 / 重置牌局 */
  function newGame(){
    stopTimer();
    clearTimeout(mismatchTimeout); mismatchTimeout=null;
    clearTimeout(shakeTimeout); shakeTimeout=null;
    stopConfetti();
    firstCard=null; secondCard=null; locked=false; moves=0; matched=0;
    updateInfo();

    Array.prototype.slice.call(boardEl.querySelectorAll(".card")).forEach(function(c){ boardEl.removeChild(c); });
    var deck=shuffle(ANIMALS.concat(ANIMALS));
    deck.forEach(function(animal){
      var btn=document.createElement("button");
      btn.type="button"; btn.className="card"; btn.dataset.animal=animal;
      btn.setAttribute("aria-label","卡牌（背面）");
      btn.innerHTML='<div class="inner"><div class="face back">🐾</div><div class="face front">'+animal+'</div></div>';
      btn.addEventListener("click", function(){ onCardClick(btn); });
      boardEl.appendChild(btn);
    });
    showScreen(gameScreen);
    startTimer();
  }

  function onCardClick(card){
    if(locked) return;                                 // 判斷期間不可再翻
    if(card.classList.contains("matched")) return;     // 已配對不可點
    if(card.classList.contains("flipped")) return;     // 同一張不可點兩次

    card.classList.add("flipped");
    card.setAttribute("aria-label","卡牌 "+card.dataset.animal);
    playSound("flip");

    if(!firstCard){ firstCard=card; return; }

    secondCard=card;
    locked=true;
    moves++; updateInfo();

    if(firstCard.dataset.animal===secondCard.dataset.animal){
      var a=firstCard, b=secondCard;
      a.classList.add("matched"); b.classList.add("matched");
      matched++; updateInfo(); showToast();
      setTimeout(function(){ playSound("match"); vibrate(30); },180);
      firstCard=null; secondCard=null; locked=false;
      if(matched===TOTAL_PAIRS) setTimeout(finishGame,700);
    }else{
      var x=firstCard, y=secondCard;
      shakeTimeout=setTimeout(function(){
        x.classList.add("shake"); y.classList.add("shake");
        playSound("miss"); vibrate([40,30,40]);
        shakeTimeout=null;
      },380);
      mismatchTimeout=setTimeout(function(){
        x.classList.remove("shake"); y.classList.remove("shake");
        x.classList.remove("flipped"); y.classList.remove("flipped");
        x.setAttribute("aria-label","卡牌（背面）"); y.setAttribute("aria-label","卡牌（背面）");
        firstCard=null; secondCard=null; locked=false; mismatchTimeout=null;
      },1000);
    }
  }

  function showToast(){
    toastEl.classList.remove("show");
    void toastEl.offsetWidth;                          // 重新觸發動畫
    toastEl.classList.add("show");
  }

  function getRating(m,s){
    if(m<12 && s<=30) return "🏆 記憶大師";
    if(m<16 && s<=60) return "⭐ 表現優秀";
    if(m<20 && s<=90) return "😊 不錯喔";
    return "🌱 再挑戰一次";
  }

  function finishGame(){
    stopTimer();
    elapsed=Math.floor((Date.now()-startTime)/1000);
    timeEl.textContent=formatTime(elapsed);
    $("rTime").textContent=elapsed;
    $("rMoves").textContent=moves;
    $("rPairs").textContent=matched+" / "+TOTAL_PAIRS;
    $("rRating").textContent=getRating(moves,elapsed);

    var best=loadBest(), isNew=false;
    if(best.time===null || elapsed<best.time){ best.time=elapsed; isNew=true; }
    if(best.moves===null || moves<best.moves){ best.moves=moves; isNew=true; }
    if(isNew) saveBest(best);
    $("newRec").hidden=!isNew;
    $("rBest").textContent=bestText(best);
    renderStartBest();

    showScreen(resultScreen);
    playSound("win"); vibrate([60,40,60,40,120]);
    startConfetti();
  }

  $("muteBtn").addEventListener("click", function(){
    muted=!muted;
    try{ localStorage.setItem(MUTE_KEY, muted?"1":"0"); }catch(e){}
    renderMute();
    if(!muted) playSound("flip");
  });
  renderMute();
  renderStartBest();

  $("startBtn").addEventListener("click", newGame);
  $("restartBtn").addEventListener("click", newGame);
  $("againBtn").addEventListener("click", newGame);
})();
</script>
</body>
</html>
